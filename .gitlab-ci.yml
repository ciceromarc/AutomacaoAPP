# Pipeline GitLab CI/CD para Testes Cypress com Relatórios Allure
# Data: 20 de agosto de 2025

# Definição dos estágios do pipeline
stages:
  - test


# Variáveis globais
variables:
  NODE_VERSION: "18"
  ALLURE_VERSION: "2.34.1"

# Stage 2: Execução dos testes Cypress
test_cypress:
  stage: test
  image: cypress/included:latest
  before_script:
    # Configurações para ambiente headless
    #- export DISPLAY=:99
    - export CYPRESS_baseUrl=${CYPRESS_BASE_URL:-"https://novo-kim-tst.usekim.com.br/"}
    # Instalar Java para o Allure
    - apt-get update && apt-get install -y default-jdk
    - export JAVA_HOME=/usr/lib/jvm/default-java
    - export PATH=$JAVA_HOME/bin:$PATH
  script:
    # Instalar dependências do sistema primeiro
    - apt-get update && apt-get install -y libgtk2.0-0 libgtk-3-0 libgbm-dev libnotify-dev libnss3 libxss1 libasound2 libxtst6 xauth xvfb
    - service dbus start
    # Verificar se Java está instalado
    - java -version
    - echo $JAVA_HOME
    # Configurar hosts e instalar dependências
    - echo "172.32.52.59 novo-kim-tst.usekim.com.br kim-idp-dev.usekim.com.br" >> /etc/hosts
    - npm install
    - npx cypress install
    # Executa os testes com geração de relatório Allure
    - npm run cypress:run
  after_script:
    - npm run report:allure:ci
    # Lista arquivos gerados para debug
    - ls -la allure-results/ || echo "Pasta allure-results não encontrada"
    - ls -la cypress/screenshots/ || echo "Pasta screenshots não encontrada"
    - ls -la cypress/videos/ || echo "Pasta videos não encontrada"
  artifacts:
    when: always
    paths:
      - allure-results/
      - allure-report/
      - cypress/screenshots/
      - cypress/videos/
      - cypress/reports/
    expire_in: 2 days
  retry:
    max: 2
    when:
      - unknown_failure
      - api_failure
      - runner_system_failure
  only:
    - merge_requests
    - main
    - develop
    - esteira-config

